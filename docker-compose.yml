# Cyber Ask Domains — local / lab stack
# Build once (shared image), reuse for web + celery + beat.

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    REQUIREMENTS_FILE: requirements/development.txt
    # Set to "0" for a faster image when invoice PDFs are not needed in lab
    INSTALL_WKHTMLTOPDF: "1"

x-app-common: &app-common
  image: cyberask-domains:local
  build: *app-build
  env_file:
    - .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: cyberask_domains.settings.development
    MIGRATION_LOCK_ID: "8453201"
  volumes:
    - .:/app
    - media_files:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      # Keep DB identity stable so existing server .env DATABASE_URL keeps working.
      POSTGRES_DB: grumpy_portal
      POSTGRES_USER: grumpy
      POSTGRES_PASSWORD: grumpy_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grumpy -d grumpy_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  web:
    <<: *app-common
    command: ["python", "manage.py", "runserver", "0.0.0.0:7000"]
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    ports:
      # Shared host: avoid :80/:8000 used by other services. Prefix 7.
      # Direct app :7000. Loopback :7001 for local tools. Compose nginx :780.
      - "7000:7000"
      - "127.0.0.1:7001:7000"
    networks:
      default:
      edge:
        aliases:
          # Name the public-site nginx container uses: http://cyberask-domains:7000
          - cyberask-domains
    environment:
      <<: *app-env
      RUN_STARTUP_MIGRATIONS: "1"
      MIGRATION_LEADER: "1"
      AUTO_MAKEMIGRATIONS: "0"
      RUN_COLLECTSTATIC: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery:
    <<: *app-common
    command: ["celery", "-A", "cyberask_domains", "worker", "-l", "info"]
    environment:
      <<: *app-env
      RUN_STARTUP_MIGRATIONS: "0"
      MIGRATION_LEADER: "0"
      AUTO_MAKEMIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"

  celery-beat:
    <<: *app-common
    command: ["celery", "-A", "cyberask_domains", "beat", "-l", "info"]
    volumes:
      - .:/app
    environment:
      <<: *app-env
      RUN_STARTUP_MIGRATIONS: "0"
      MIGRATION_LEADER: "0"
      AUTO_MAKEMIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "780:780"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/sites:/etc/nginx/conf.d/sites:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:

networks:
  # Join the public website nginx network so that container can proxy
  # to http://cyberask-domains:7000 (127.0.0.1 inside that container is itself).
  # Override if `docker network ls` shows a different name:
  #   EDGE_NETWORK=some_other_frontend docker compose up -d
  edge:
    name: ${EDGE_NETWORK:-ca_public_website_frontend}
    external: true
