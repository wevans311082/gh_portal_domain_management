# Drop-in for the HOST nginx that already binds :80 / :443.
# Do not use the compose nginx on :80 on a shared server.
#
# Install (Debian/Ubuntu conf.d):
#   sudo cp nginx/host-dropin/domains.cyberask.co.uk.conf \
#          /etc/nginx/conf.d/domains.cyberask.co.uk.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or sites-available:
#   sudo cp nginx/host-dropin/domains.cyberask.co.uk.conf \
#          /etc/nginx/sites-available/domains.cyberask.co.uk.conf
#   sudo ln -sf /etc/nginx/sites-available/domains.cyberask.co.uk.conf \
#               /etc/nginx/sites-enabled/domains.cyberask.co.uk.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Backend: Django / gunicorn published at 127.0.0.1:7000 (compose web).
# Compose nginx (static helper) is on 127.0.0.1:780 if you prefer that hop.

upstream cyberask_domains_app {
    server 127.0.0.1:7000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name domains.cyberask.co.uk;

    client_max_body_size 20m;

    location / {
        proxy_pass http://cyberask_domains_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

