# Edge nginx vhost for domains.cyberask.co.uk.
#
# If the edge nginx runs ON THE HOST (not in Docker), use 127.0.0.1:7000.
# If the edge nginx is A CONTAINER (ca_public_website), do not use 127.0.0.1 —
# that is the nginx container itself. Use the Docker DNS name instead:
#   server cyberask-domains:7000;
# This stack joins network ca_public_website_frontend with that alias.
#
# Public-site install (preferred on this host):
#   copy into ca_public_website/nginx/sites/ (already shipped as domains.conf)
#   docker compose -f ca_public_website/docker-compose.yml exec nginx nginx -s reload
#
# Host nginx install:
#   sudo cp nginx/host-dropin/domains.cyberask.co.uk.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

upstream cyberask_domains_app {
    # Container-to-container (public-site nginx on Docker network):
    server cyberask-domains:7000;
    keepalive 8;
    # Host nginx only — uncomment and comment the line above:
    # server 127.0.0.1:7000;
}

server {
    listen 80;
    listen [::]:80;
    server_name domains.cyberask.co.uk;

    client_max_body_size 20m;

    location / {
        proxy_pass http://cyberask_domains_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

