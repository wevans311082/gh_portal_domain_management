{% extends "base_admin.html" %}
{% block title %}Domain · {{ SITE_NAME }}{% endblock %}
{% block page_title %}{% if mode == 'create' %}Create Domain{% else %}Edit Domain{% endif %}{% endblock %}
{% block content %}
<form method="post" class="fluent-card p-6 max-w-5xl space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex flex-wrap gap-3">
        <button class="btn-primary" type="submit">Save local record</button>
        <a href="{% url 'admin_tools:domains_list' %}" class="btn-secondary">Back to domains</a>
    </div>
</form>
{% endblock %}
