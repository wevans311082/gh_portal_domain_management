{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="auth-shell min-h-full flex flex-col cyber-line-bg">
    <div class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <div class="text-center text-white mb-6">
                <img src="{% static 'images/logo.svg' %}" alt="{{ SITE_NAME }}" class="h-16 w-16 rounded-xl object-cover mx-auto mb-3 ring-1 ring-sky-400/40 bg-slate-900">
                <h1 class="text-xl font-semibold tracking-tight">{{ SITE_NAME }}</h1>
                <p class="text-xs text-sky-200/90 mt-1">Domains &amp; hosting by Cyber Ask Ltd</p>
            </div>
            <div class="auth-card p-6 sm:p-8">
                {% block content %}{% endblock %}
            </div>
            <p class="text-center text-xs text-white/55 mt-6">
                &copy; {% now "Y" %} Cyber Ask Ltd ·
                <a href="https://www.cyberask.co.uk" class="underline hover:text-white">www.cyberask.co.uk</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
