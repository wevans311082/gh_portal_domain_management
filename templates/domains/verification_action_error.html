{% extends "base_portal.html" %}
{% block page_title %}Registrar verification{% endblock %}
{% block content %}
<section class="rounded-xl border border-slate-300 bg-white p-6 text-slate-900">
    <h1 class="text-xl font-semibold">Verification request could not be queued</h1>
    <p role="alert" class="mt-3 text-sm text-slate-700">{{ message }}</p>
    <a href="{% url 'domains:detail' domain.pk %}" class="mt-4 inline-block font-semibold text-sky-800 underline">Return to {{ domain.name }}</a>
</section>
{% endblock %}
