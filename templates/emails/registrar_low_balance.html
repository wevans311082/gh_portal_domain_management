<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>{{ site_name }}</title></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#333;">
<h2 style="color:#f97316;">{{ site_name }}</h2>
<p>The registrar account balance is below the alert threshold.</p>
<ul>
  <li><strong>Balance:</strong> {{ balance }}</li>
  <li><strong>Threshold:</strong> {{ threshold }}</li>
</ul>
<p>Top up the registrar account before domain registrations and renewals start failing.</p>
</body>
</html>
