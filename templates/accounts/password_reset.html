{% extends "base_auth.html" %}

{% block title %}Reset Password - {{ SITE_NAME }}{% endblock %}

{% block content %}
<h2 class="text-xl font-semibold text-center text-slate-900 mb-2">Reset password</h2>
<p class="text-sm text-slate-600 text-center mb-6">Enter your account email and we will send a reset link if it exists.</p>
<form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_email">Email address</label>
        <input type="email" name="email" id="id_email" required autocomplete="email"
               class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit" class="w-full btn-primary py-3">Send reset link</button>
</form>
<p class="text-center mt-5 text-sm"><a href="{% url 'account_login' %}" class="text-sky-600 hover:underline">Back to sign in</a></p>
{% endblock %}
