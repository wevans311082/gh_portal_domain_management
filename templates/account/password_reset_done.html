{% extends "base_auth.html" %}

{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}

{% block content %}
<h2 class="text-xl font-semibold text-center text-slate-900 mb-2">Check your email</h2>
<p class="text-sm text-slate-600 text-center mb-6">
  If an account exists for that address, we’ve sent password reset instructions.
  Check your inbox and spam folder.
</p>
<p class="text-center text-sm">
  <a href="{% url 'account_login' %}" class="text-brand-600 hover:underline font-medium">Return to sign in</a>
</p>
{% endblock %}
